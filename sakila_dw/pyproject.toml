# ============================================================
# sakila_dw Dependencies
# 
# This is a script-based project, not a library.
# We only use pyproject.toml for dependency management with uv.
# 
# NOTE: For this project, use `uv sync --no-editable` since this is
# not a distributable Python package.
# ============================================================

[project]
# Minimal metadata - this is not a distributable package
name = "sakila-dw"
version = "0.0.0"
requires-python = ">=3.8"
description = "Sakila Data Warehouse ETL Pipeline"

# Core dependencies (required for runtime)
dependencies = [
    "psycopg2-binary>=2.9",
    "PyMySQL>=1.1",
    "pytest>=8.3.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.5",
    "ruff>=0.1.0",
    "PyYAML>=6.0",  # Also needed for development (config validation, etc.)
]

# Airflow integration (optional)
airflow = [
    "apache-airflow>=2.9",
]

# Tool configurations
[tool.ruff]
line-length = 88
target-version = "py38"

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
